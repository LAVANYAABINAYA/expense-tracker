<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header><p class="eyebrow">PERSONAL FINANCE</p><h1>Expense Tracker</h1><p class="muted">A simple way to understand where your money goes.</p></header>
    <section class="summary">
      <article><span>Total spent</span><strong id="total">₹0.00</strong></article>
      <article><span>Transactions</span><strong id="count">0</strong></article>
    </section>
    <section class="panel">
      <h2>Add an expense</h2>
      <form id="expense-form">
        <label>Description<input id="description" maxlength="60" placeholder="e.g. Lunch" required></label>
        <div class="fields">
          <label>Amount (₹)<input id="amount" type="number" min="0.01" step="0.01" placeholder="250" required></label>
          <label>Category<select id="category"><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Other</option></select></label>
        </div>
        <button type="submit">Add expense</button>
      </form>
    </section>
    <section class="panel">
      <div class="list-heading"><h2>Recent expenses</h2><button id="clear" class="secondary" type="button">Clear all</button></div>
      <ul id="expense-list" class="expense-list"><li class="empty">No expenses yet. Add your first one above.</li></ul>
    </section>
    <footer>Saved in this browser using local storage.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
